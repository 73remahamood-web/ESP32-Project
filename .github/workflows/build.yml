name: Build ESP32-CAM Motor Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core 3.3.12
        run: |
          arduino-cli config init

          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core install esp32:esp32@3.3.12 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Prepare ESP32-CAM sketch
        env:
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          mkdir -p sketch
          cp MyFirmware.ino sketch/sketch.ino

          python3 <<'PY'
          from pathlib import Path
          import os
          import json

          p = Path("sketch/sketch.ino")
          s = p.read_text()

          password = os.environ.get("WIFI_PASSWORD", "")

          if not password:
              raise SystemExit(
                  "GitHub secret WIFI_PASSWORD is missing."
              )

          # json.dumps gives us a safely quoted C/C++ style string
          # for ordinary Wi-Fi passwords.
          quoted = json.dumps(password)

          s = s.replace(
              '"__WIFI_PASSWORD__"',
              quoted
          )

          p.write_text(s)

          print("Wi-Fi secret injected without printing it.")
          PY

      - name: Compile AI Thinker ESP32-CAM
        run: |
          mkdir -p build

          arduino-cli compile \
            --fqbn esp32:esp32:esp32cam \
            --output-dir build \
            sketch

      - name: Verify firmware files
        run: |
          test -n "$(find build -type f -name '*.bin' -print -quit)"
          find build -maxdepth 2 -type f \
            \( -name '*.bin' -o -name '*.elf' \) \
            -print

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-motors-no-enable-v030
          path: build/
          if-no-files-found: error

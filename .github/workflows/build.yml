name: Build ESP32 DevKit Firmware

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core 3.3.12
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core install esp32:esp32@3.3.12 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Prepare Arduino sketch
        run: |
          mkdir -p sketch
          cp MyFirmware.ino sketch/sketch.ino

      - name: Compile ESP32 DevKit
        run: |
          mkdir -p build

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir build \
            sketch

      - name: Show generated files
        run: |
          find build -type f -maxdepth 2 -print

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-devkit-ping
          path: build/
          if-no-files-found: error

name: Compile ESP32-CAM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v1
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Prepare sketch folder
        run: |
          mkdir -p output
          INO_FILE=$(find . -name "*.ino" -type f -not -path "./.git/*" -not -path "./build_sketch/*" | head -n 1)
          if [ -z "$INO_FILE" ]; then
            echo "❌ No .ino file found!"
            exit 1
          fi
          echo "✅ Found sketch: $INO_FILE"
          SKETCH_NAME=$(basename "$INO_FILE" .ino)
          SRC_DIR=$(dirname "$INO_FILE")
          mkdir -p "build_sketch/$SKETCH_NAME"
          for f in "$SRC_DIR"/*; do
            base=$(basename "$f")
            case "$base" in
              build_sketch|output|.git) continue ;;
            esac
            cp -r "$f" "build_sketch/$SKETCH_NAME/"
          done
          if [ ! -f "build_sketch/$SKETCH_NAME/$SKETCH_NAME.ino" ]; then
            echo "⚠️ Renaming main .ino to match folder..."
            mv "build_sketch/$SKETCH_NAME/"*.ino "build_sketch/$SKETCH_NAME/$SKETCH_NAME.ino"
          fi
          echo "SKETCH_DIR=build_sketch/$SKETCH_NAME" >> $GITHUB_ENV
      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32cam --output-dir ./output "$SKETCH_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: ./output/*.bin
